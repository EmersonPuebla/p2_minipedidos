# ============================================================
# MiniPedidos - Fases 12 y 13 (concurrency + ACK/NACK + DLX/DLQ)
# ============================================================
spring.application.name=minipedidos
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------
# RabbitMQ
# ------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=3000

# El consumidor usa un SimpleMessageListenerContainer programatico con ACK manual.
# Los reintentos NO los maneja Spring: los decide PedidoConsumer y los programa
# ReintentoService en la cola pedidos.retry.cola.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.retry.enabled=false
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# ------------------------------------------------------------
# Parametros de la demo
# ------------------------------------------------------------
# Consumidores concurrentes (Competing Consumers) usados por @RabbitListener.
demo.consumidores=2

# Pausa simulada de procesamiento para que se vea el reparto de carga.
demo.procesamiento.delay-ms=900

# Politica de reintentos inicial (modificable desde el formulario).
demo.reintentos.max=3
demo.reintentos.intervalo-segundos=5

# Limite de mensajes que se inspeccionan de la DLQ por peticion.
demo.dlq.max-inspeccion=100

# Permite arrancar la app sin RabbitMQ para pruebas automatizadas.
# En ejecucion normal debe quedar en true.
demo.iniciar-consumidores=true

# ------------------------------------------------------------
# RabbitMQ Management API (para metricas ready/unacked reales)
# ------------------------------------------------------------
rabbitmq.management.url=${RABBITMQ_MANAGEMENT_URL:http://127.0.0.1:15672}
rabbitmq.management.username=${RABBITMQ_USER:guest}
rabbitmq.management.password=${RABBITMQ_PASSWORD:guest}

# ------------------------------------------------------------
# Recursos estaticos sin cache (demo)
# ------------------------------------------------------------
spring.web.resources.cache.period=0
